<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="t d">
  <title id="t">Egor Yarovitsyn — frontend developer</title>
  <desc id="d">Frontend developer: React, Next.js, TypeScript, Python / FastAPI, AI-assisted development. Lead frontend developer at Sovcombank, 4 years of commercial development, IT Purple Hack 2025 winner. On the right, an animated flow of his MCP server: agent, MCP server, OpenAPI spec, TypeScript types, React UI.</desc>
  <style>
    .drift1 { animation: drift1 18s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .drift2 { animation: drift2 22s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    .drift3 { animation: drift3 26s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: center; }
    @keyframes drift1 { from { transform: translate(0, 0) scale(1); } to { transform: translate(120px, 40px) scale(1.15); } }
    @keyframes drift2 { from { transform: translate(0, 0) scale(1.1); } to { transform: translate(-140px, -30px) scale(0.95); } }
    @keyframes drift3 { from { transform: translate(0, 0); } to { transform: translate(80px, -50px); } }
    .floor { animation: floor 1.6s linear infinite; }
    @keyframes floor { from { transform: translateY(0); } to { transform: translateY(24px); } }
    .star { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; } 50% { opacity: 0.9; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .live { animation: live 1.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes live { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.6); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .drift1, .drift2, .drift3, .floor, .star, .cursor, .live { animation: none; }
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .sans { font-family: ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <clipPath id="card"><rect width="1200" height="420" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="64" y1="0" x2="660" y2="0" spreadMethod="reflect">
      <stop offset="0" stop-color="#67E8F9"/>
      <stop offset="0.45" stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-260 0; 260 0; -260 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" gradientUnits="userSpaceOnUse" x1="760" y1="0" x2="1110" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="floorMask"><rect x="0" y="322" width="1200" height="98" fill="url(#fade)"/></mask>
    <path id="flow" d="M770 118 C 830 70, 880 66, 930 86 C 990 108, 1050 104, 1084 150 C 1112 192, 1050 236, 984 240 C 920 244, 870 268, 806 250"/>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="420" fill="#060914"/>

    <g filter="url(#blur)" opacity="0.85">
      <ellipse class="drift1" cx="230" cy="70" rx="260" ry="140" fill="#0EA5E9" opacity="0.45"/>
      <ellipse class="drift2" cx="980" cy="120" rx="300" ry="150" fill="#7C3AED" opacity="0.5"/>
      <ellipse class="drift3" cx="640" cy="380" rx="340" ry="110" fill="#DB2777" opacity="0.28"/>
    </g>

    <g mask="url(#floorMask)" stroke="#22D3EE" stroke-opacity="0.55" stroke-width="1">
      <g>
        <path d="M600 322 L-600 420 M600 322 L-300 420 M600 322 L0 420 M600 322 L200 420 M600 322 L400 420 M600 322 L600 420 M600 322 L800 420 M600 322 L1000 420 M600 322 L1200 420 M600 322 L1500 420 M600 322 L1800 420"/>
      </g>
      <g class="floor">
        <path d="M0 304 H1200 M0 328 H1200 M0 352 H1200 M0 376 H1200 M0 400 H1200 M0 424 H1200 M0 448 H1200"/>
      </g>
    </g>
    <rect x="0" y="321" width="1200" height="1" fill="#67E8F9" opacity="0.35"/>

    <g fill="#E0F2FE">
      <circle class="star" cx="420" cy="40" r="1.2"/>
      <circle class="star" cx="510" cy="96" r="1" style="animation-delay:1.2s"/>
      <circle class="star" cx="690" cy="34" r="1.4" style="animation-delay:2.1s"/>
      <circle class="star" cx="640" cy="150" r="1" style="animation-delay:0.6s"/>
      <circle class="star" cx="1150" cy="60" r="1.2" style="animation-delay:1.7s"/>
      <circle class="star" cx="1160" cy="250" r="1" style="animation-delay:2.8s"/>
      <circle class="star" cx="560" cy="250" r="1.1" style="animation-delay:3.3s"/>
      <circle class="star" cx="300" cy="30" r="1" style="animation-delay:0.3s"/>
      <circle class="star" cx="720" cy="270" r="1.3" style="animation-delay:2.5s"/>
      <circle class="star" cx="40" cy="250" r="1" style="animation-delay:1.4s"/>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="419" rx="24" fill="none" stroke="#FFFFFF" stroke-opacity="0.08"/>

  <g class="mono" font-size="17" fill="#67E8F9">
    <text x="64" y="84">~/egor $ whoami</text>
    <rect class="cursor" x="222" y="69" width="10" height="19" fill="#67E8F9"/>
  </g>

  <text class="sans" x="62" y="160" font-size="66" font-weight="800" letter-spacing="-1" fill="url(#name)">Egor Yarovitsyn</text>

  <g class="sans">
    <text x="64" y="204" font-size="23" fill="#E2E8F0">Frontend developer · React · Next.js · TypeScript</text>
    <text x="64" y="238" font-size="19" fill="#94A3B8">+ Python / FastAPI backend · AI-assisted development</text>
  </g>

  <g class="sans" font-size="15" font-weight="600">
    <rect x="64" y="262" width="252" height="38" rx="19" fill="#0B1222" fill-opacity="0.85" stroke="#34D399" stroke-opacity="0.55"/>
    <circle cx="86" cy="281" r="5" fill="#34D399"/>
    <circle class="live" cx="86" cy="281" r="5" fill="#34D399"/>
    <text x="100" y="286" fill="#A7F3D0">Lead frontend · Sovcombank</text>

    <rect x="328" y="262" width="164" height="38" rx="19" fill="#0B1222" fill-opacity="0.85" stroke="#A78BFA" stroke-opacity="0.55"/>
    <text x="410" y="286" text-anchor="middle" fill="#DDD6FE">4 yrs commercial</text>

    <rect x="504" y="262" width="230" height="38" rx="19" fill="#0B1222" fill-opacity="0.85" stroke="#FBBF24" stroke-opacity="0.55"/>
    <text x="619" y="286" text-anchor="middle" fill="#FDE68A">IT Purple Hack 2025 winner</text>
  </g>

  <g>
    <use href="#flow" fill="none" stroke="url(#edge)" stroke-width="2" stroke-opacity="0.35"/>
    <use href="#flow" fill="none" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 10" stroke-opacity="0.8">
      <animate attributeName="stroke-dashoffset" from="0" to="-160" dur="4s" repeatCount="indefinite"/>
    </use>

    <g filter="url(#glow)">
      <circle r="4.5" fill="#FDE68A">
        <animateMotion dur="6s" repeatCount="indefinite" rotate="auto"><mpath href="#flow"/></animateMotion>
      </circle>
      <circle r="4.5" fill="#67E8F9">
        <animateMotion dur="6s" begin="-2s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
      </circle>
      <circle r="4.5" fill="#F0ABFC">
        <animateMotion dur="6s" begin="-4s" repeatCount="indefinite"><mpath href="#flow"/></animateMotion>
      </circle>
    </g>

    <g class="mono" font-weight="700" text-anchor="middle">
      <g transform="translate(770 118)">
        <circle r="34" fill="none" stroke="#22D3EE" stroke-opacity="0.5"><animate attributeName="r" values="28;40;28" dur="6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="6s" repeatCount="indefinite"/></circle>
        <circle r="28" fill="#0B1222" stroke="#22D3EE" stroke-width="1.5"/>
        <text y="5" font-size="14" fill="#A5F3FC">AI</text>
        <text y="52" font-size="12" font-weight="500" fill="#94A3B8">agent</text>
      </g>
      <g transform="translate(930 86)">
        <circle r="34" fill="none" stroke="#67E8F9" stroke-opacity="0.5"><animate attributeName="r" values="28;40;28" dur="6s" begin="1.2s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="6s" begin="1.2s" repeatCount="indefinite"/></circle>
        <circle r="30" fill="#0B1222" stroke="#67E8F9" stroke-width="2"/>
        <text y="5" font-size="14" fill="#F8FAFC">MCP</text>
        <text y="54" font-size="12" font-weight="500" fill="#94A3B8">my MCP server</text>
      </g>
      <g transform="translate(1084 150)">
        <circle r="34" fill="none" stroke="#A78BFA" stroke-opacity="0.5"><animate attributeName="r" values="28;40;28" dur="6s" begin="2.4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="6s" begin="2.4s" repeatCount="indefinite"/></circle>
        <circle r="28" fill="#0B1222" stroke="#A78BFA" stroke-width="1.5"/>
        <text y="5" font-size="14" fill="#DDD6FE">API</text>
        <text y="52" font-size="12" font-weight="500" fill="#94A3B8">OpenAPI</text>
      </g>
      <g transform="translate(984 240)">
        <circle r="34" fill="none" stroke="#C084FC" stroke-opacity="0.5"><animate attributeName="r" values="28;40;28" dur="6s" begin="3.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="6s" begin="3.6s" repeatCount="indefinite"/></circle>
        <circle r="28" fill="#0B1222" stroke="#C084FC" stroke-width="1.5"/>
        <text y="5" font-size="14" fill="#F5D0FE">TS</text>
        <text y="52" font-size="12" font-weight="500" fill="#94A3B8">TS types</text>
      </g>
      <g transform="translate(806 250)">
        <circle r="34" fill="none" stroke="#F472B6" stroke-opacity="0.5"><animate attributeName="r" values="28;40;28" dur="6s" begin="4.8s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values="0.6;0;0.6" dur="6s" begin="4.8s" repeatCount="indefinite"/></circle>
        <circle r="28" fill="#0B1222" stroke="#F472B6" stroke-width="1.5"/>
        <text y="5" font-size="13" fill="#FBCFE8">&lt;/&gt;</text>
        <text y="52" font-size="12" font-weight="500" fill="#94A3B8">React UI</text>
      </g>
    </g>
  </g>

  <text class="mono" x="1136" y="396" font-size="12" text-anchor="end" fill="#64748B">agent → my MCP server → OpenAPI → TS types → React</text>
</svg>
